<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>اتصل بنا | AdaaHub</title>

<meta name="description"
content="تواصل مع فريق AdaaHub لإرسال الاقتراحات والملاحظات والإبلاغ عن مشاكل الأدوات.">

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,Tahoma,sans-serif;
background:#f5f7fb;
color:#20242a;
line-height:1.8;
}

header{
background:#fff;
border-bottom:1px solid #e5e7eb;
padding:17px 20px;
}

.header{
max-width:1000px;
margin:auto;
display:flex;
align-items:center;
justify-content:space-between;
}

.logo{
font-size:27px;
font-weight:bold;
}

.logo span{
color:#2563eb;
}

.home{
color:#2563eb;
text-decoration:none;
}

.container{
max-width:850px;
margin:45px auto;
padding:20px;
}

.card{
background:#fff;
border:1px solid #e5e7eb;
border-radius:18px;
padding:35px;
}

h1{
font-size:32px;
margin-bottom:12px;
color:#111827;
}

.intro{
color:#666;
margin-bottom:25px;
}

.form-group{
margin-bottom:18px;
}

label{
display:block;
font-weight:bold;
margin-bottom:7px;
}

input,
textarea{
width:100%;
padding:13px 15px;
border:1px solid #d1d5db;
border-radius:9px;
font-family:inherit;
font-size:15px;
outline:none;
}

input:focus,
textarea:focus{
border-color:#2563eb;
box-shadow:0 0 0 3px rgba(37,99,235,.1);
}

textarea{
min-height:150px;
resize:vertical;
}

button{
width:100%;
padding:14px;
border:0;
border-radius:9px;
background:#2563eb;
color:#fff;
font-family:inherit;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}

.note{
margin-top:20px;
padding:15px;
background:#eff6ff;
border:1px solid #bfdbfe;
border-radius:10px;
color:#1e40af;
font-size:14px;
}

footer{
margin-top:60px;
background:#111827;
color:#cbd5e1;
padding:30px 20px;
text-align:center;
}

@media(max-width:600px){

.container{
margin-top:25px;
padding:15px;
}

.card{
padding:25px 18px;
}

h1{
font-size:27px;
}

}

</style>

</head>

<body>

<header>

<div class="header">

<div class="logo">
Adaa<span>Hub</span>
</div>

<a class="home" href="../index.html">
الرئيسية
</a>

</div>

</header>


<main class="container">

<div class="card">

<h1>اتصل بنا</h1>

<p class="intro">
يسعدنا استقبال اقتراحاتك وملاحظاتك. إذا وجدت مشكلة في إحدى
الأدوات أو لديك فكرة لأداة جديدة، يمكنك التواصل معنا.
</p>

<form
action="mailto:ضع-بريدك-هنا@example.com"
method="post"
enctype="text/plain">

<div class="form-group">

<label for="name">
الاسم
</label>

<input
type="text"
id="name"
name="name"
placeholder="اكتب اسمك"
required>

</div>


<div class="form-group">

<label for="email">
البريد الإلكتروني
</label>

<input
type="email"
id="email"
name="email"
placeholder="example@email.com"
required>

</div>


<div class="form-group">

<label for="message">
رسالتك
</label>

<textarea
id="message"
name="message"
placeholder="اكتب رسالتك هنا..."
required></textarea>

</div>


<button type="submit">
إرسال الرسالة
</button>

</form>


<div class="note">

💡 <strong>ملاحظة:</strong>
استبدل البريد الموجود في الكود بعنوان البريد الإلكتروني
الذي تريد استقبال رسائل AdaaHub عليه.

</div>

</div>

</main>


<footer>

<p>
© 2026 AdaaHub - جميع الحقوق محفوظة
</p>

</footer>

</body>

</html>
